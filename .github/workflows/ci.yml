name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  linux:
    name: linux / gcc / asan+ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DTSB_SANITIZE=ON

      - name: build
        run: cmake --build build --parallel

      - name: test
        run: ctest --test-dir build --output-on-failure

  linux-release:
    name: linux / gcc / release, no sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTSB_SANITIZE=OFF

      - name: build
        run: cmake --build build --parallel

      - name: test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: windows / msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: cmake -B build -DTSB_SANITIZE=OFF

      - name: build
        run: cmake --build build --config Debug

      - name: test
        run: ctest --test-dir build -C Debug --output-on-failure
