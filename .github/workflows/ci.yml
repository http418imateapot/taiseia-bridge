name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  linux:
    name: linux / gcc / asan+ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DTSB_SANITIZE=ON -DTSB_WERROR=ON

      - name: build
        run: cmake --build build --parallel

      # -V so the assertion count reaches the log. A test suite that passes
      # because it asserted nothing looks identical to one that passes.
      - name: test
        run: ctest --test-dir build --output-on-failure -V

      # The unit tests prove the pieces; this proves they were wired together.
      # Sanitizers are still on, so the whole run is checked for memory errors.
      - name: smoke test the simulator
        run: |
          ./build/taiseia-cli --link sim identify
          ./build/taiseia-cli --link sim read 4 7
          ./build/taiseia-cli --link sim write 4 3 70
          ./build/taiseia-bridge --link sim -c examples/config/simulator.conf --run-for 3

      # A fake socket agrees with whatever our client does, including whatever
      # it does wrong. Mosquitto is an independent implementation and does not.
      - name: install a broker
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mosquitto mosquitto-clients

      - name: integration test against a real broker
        run: |
          sudo systemctl stop mosquitto 2>/dev/null || true
          ./scripts/integration-broker.sh ./build/taiseia-bridge

  # The tests establish that this program does what we expect. This job asks
  # whether what we expect is right, and whether the source says it rather than
  # the compiler happening to. See docs/verification.md.
  verify:
    name: linux / oracle and proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: install the solver and the model checker
        run: |
          python3 scripts/install.py --python "$(command -v python3)"
          curl --fail --location --retry 3 -o /tmp/cbmc.deb https://github.com/diffblue/cbmc/releases/download/cbmc-6.11.0/ubuntu-24.04-cbmc-6.11.0-Linux.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/cbmc.deb

      # Whatever these report is what may be quoted. Nothing is cited from
      # memory -- see AGENTS.md.
      - name: versions
        run: |
          cbmc --version
          .venv/bin/python --version
          .venv/bin/python -c "import z3; print('z3', z3.get_version_string())"

      # Two independent transcriptions of the same equations, compared cell by
      # cell. Non-zero exit means one of them is wrong, and nothing downstream
      # is worth running until that is settled.
      - name: compile the independent lab experiment with sanitizers
        run: |
          mkdir -p out
          gcc -std=c99 -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic \
            -fsanitize=address,undefined -fno-sanitize-recover=all -g \
            -Isrc -Ilab/subject -Ilab/proofs lab/subject/experiment.c \
            lab/subject/metadata.c lab/proofs/reference.c \
            src/core/taiseia/general.c src/core/taiseia/datatype.c \
            src/core/taiseia/frame.c -o out/lab-experiment

      - name: reproduce R21 and require complete evidence
        run: .venv/bin/python -m lab.run --output out/r21 --c-experiment out/lab-experiment --cbmc cbmc --require-full

      - name: keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r21-evidence
          path: out/r21/

  lab-python:
    name: lab / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install into the project venv
        shell: bash
        run: python scripts/install.py --python "$(python -c 'import sys; print(sys.executable)')"
      - name: run Python regression tests
        shell: bash
        run: |
          if [ -f .venv/Scripts/python.exe ]; then
            .venv/Scripts/python.exe -m unittest discover -s lab/tests -v
          else
            .venv/bin/python -m unittest discover -s lab/tests -v
          fi

  linux-release:
    name: linux / gcc / release, no sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTSB_SANITIZE=OFF -DTSB_WERROR=ON

      - name: build
        run: cmake --build build --parallel

      - name: test
        run: ctest --test-dir build --output-on-failure

      - name: smoke test the simulator
        run: ./build/taiseia-bridge --link sim -c examples/config/simulator.conf --run-for 3

  windows:
    name: windows / msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: configure
        run: cmake -B build -DTSB_SANITIZE=OFF -DTSB_WERROR=ON

      - name: build
        run: cmake --build build --config Debug

      - name: test
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: smoke test the simulator
        run: |
          .\build\Debug\taiseia-cli.exe --link sim identify
          .\build\Debug\taiseia-bridge.exe --link sim -c examples/config/simulator.conf --run-for 3
