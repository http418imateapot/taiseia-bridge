# taiseia-bridge -- simulator profile
#
# Run with:  taiseia-bridge --link sim -c examples/config/simulator.conf
#
# No broker is configured, so the payloads are written to the log instead of
# published. That is the point of this file: the whole path runs with no
# hardware and no broker.

device_id       = SIM-0001
report_interval = 5
log_level       = info

# mqtt_host is deliberately unset. Set it to switch the service on:
# mqtt_host = 127.0.0.1
# mqtt_port = 1883
