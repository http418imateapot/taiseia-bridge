# taiseia-bridge -- a real appliance and a real broker
#
# Every value here is a property of one deployment, which is why none of them
# is compiled in.

device_id   = TS-0001

# The appliance link. 9600 8N1 is what the standard specifies by default.
serial_port = /dev/ttyUSB0
# serial_port = COM3            # Windows; COM10 and above are handled for you
serial_baud = 9600

# The broker. Prefer an address over a name: resolving a name is the one
# operation in this program that blocks.
mqtt_host      = 127.0.0.1
mqtt_port      = 1883
mqtt_username  = TS-0001
mqtt_password  = change-me
mqtt_keepalive = 60

# There is no TLS backend built in, and setting this refuses to start rather
# than connecting in the clear under a configuration that says otherwise.
tls_enable = false

# Topics are whole templates, because the layout below the prefix is what
# differs between deployments.
# The version sits under the protocol name, not above it: what `v1` versions
# is this bridge's payload schema, so it belongs beside the thing it describes.
topic_prefix       = taiseia101/v1
topic_telemetry    = {prefix}/from/appliance/{id}/telemetry
topic_capabilities = {prefix}/from/appliance/{id}/capabilities
topic_status       = {prefix}/from/appliance/{id}/status
topic_command      = {prefix}/to/appliance/{id}/command
topic_ack          = {prefix}/from/appliance/{id}/command/ack

# A subscriber that joins late needs these to interpret anything else.
retain_capabilities = true
retain_status       = true

report_interval     = 60
reregister_interval = 300

# Write outcomes are published by name by default: ok, not_taken, read_only,
# unknown, no_reply. A backend that expects numbers gets them here, in that
# order.
# write_result_codes = 0,255,255,240,255

log_level = info
